spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: false

  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}

portone:
  base-url: "https://api.portone.io"
  api-secret: ${PORTONE_API_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  billing-channel-key: ${PORTONE_BILLING_CHANNEL_KEY:}
  connect-timeout: ${PORTONE_CONNECT_TIMEOUT:2s}
  read-timeout: ${PORTONE_READ_TIMEOUT:5s}
  webhook:
    secret: ${PORTONE_WEBHOOK_SECRET:}
