<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roviq Market</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toastHost" class="toast-host" aria-live="polite"></div>

<div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal">
        <h2 id="confirmTitle">확인</h2>
        <p id="confirmMessage"></p>
        <div class="modal-actions">
            <button type="button" class="btn secondary" id="confirmCancel">취소</button>
            <button type="button" class="btn danger" id="confirmOk">진행</button>
        </div>
    </div>
</div>

<div id="cartModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal">
        <h2>장바구니에 담았어요</h2>
        <p>바로 장바구니로 이동할까요, 계속 둘러볼까요?</p>
        <div class="modal-actions">
            <button type="button" class="btn secondary" id="keepShopping">계속 둘러보기</button>
            <button type="button" class="btn primary" id="openCart">장바구니 보기</button>
        </div>
    </div>
</div>

<header class="topbar">
    <button class="brand" type="button" data-view="home">
        <span class="brand-mark">R</span>
        <span>Roviq Market</span>
    </button>
    <label class="search">
        <span>검색</span>
        <input id="searchInput" type="search" placeholder="상품명을 검색해보세요">
    </label>
    <nav class="quick-nav">
        <button type="button" data-view="orders">주문</button>
        <button type="button" data-view="points">포인트</button>
        <button type="button" data-view="subscriptions">구독</button>
    </nav>
</header>

<main>
    <section class="hero">
        <div>
            <p class="eyebrow">오늘의 결제 혜택</p>
            <h1>상품 선택부터 결제 완료까지 한 번에</h1>
            <p>장바구니, 포인트, 멤버십, 정기 구독까지 자연스럽게 이어지는 쇼핑 경험입니다.</p>
        </div>
        <form class="login-panel" id="loginForm">
            <div class="profile-row hidden" id="profileRow">
                <div class="avatar" id="profileAvatar">R</div>
                <div>
                    <strong id="profileName">로그인됨</strong>
                    <span id="profileEmail"></span>
                </div>
            </div>
            <div id="loginFields" class="login-fields">
                <input id="emailInput" type="email" value="tester@example.com" aria-label="이메일">
                <input id="passwordInput" type="password" value="password1234" aria-label="비밀번호">
                <input id="nameInput" type="hidden" value="테스터">
                <input id="phoneInput" type="hidden" value="010-1234-5678">
            </div>
            <div class="login-actions">
                <button type="submit" class="btn primary">로그인</button>
                <button type="button" class="btn secondary" id="signupBtn">가입하기</button>
                <button type="button" class="btn secondary" id="logoutBtn">로그아웃</button>
            </div>
        </form>
    </section>

    <nav class="tabs" aria-label="쇼핑 메뉴">
        <button type="button" class="active" data-view="home">쇼핑</button>
        <button type="button" data-view="cart">장바구니</button>
        <button type="button" data-view="orders">주문</button>
        <button type="button" data-view="points">포인트</button>
        <button type="button" data-view="membership">멤버십</button>
        <button type="button" data-view="subscriptions">구독</button>
        <button type="button" data-view="seller">판매자</button>
    </nav>

    <section class="summary-grid">
        <div>
            <span>장바구니</span>
            <strong id="cartSummary">0개</strong>
        </div>
        <div>
            <span>보유 포인트</span>
            <strong id="pointSummary">-</strong>
        </div>
        <div>
            <span>멤버십</span>
            <strong id="membershipSummary">-</strong>
        </div>
        <div>
            <span>구독</span>
            <strong id="subscriptionSummary">-</strong>
        </div>
    </section>

    <section id="viewRoot"></section>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<script src="app.js"></script>
</body>
</html>
