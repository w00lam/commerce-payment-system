spring:
  application:
    name: sparta-payment-system

  profiles:
    default: local

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    web:
      pageable:
        one-indexed-parameters: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  sql:
    init:
      mode: never

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}

portone:
  base-url: "https://api.portone.io"
  api-secret: ${PORTONE_API_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  billing-channel-key: ${PORTONE_BILLING_CHANNEL_KEY:}
  connect-timeout: ${PORTONE_CONNECT_TIMEOUT:2s}
  read-timeout: ${PORTONE_READ_TIMEOUT:5s}
  webhook:
    secret: ${PORTONE_WEBHOOK_SECRET:}

subscription:
  billing:
    scheduler:
      page-size: ${SUBSCRIPTION_BILLING_PAGE_SIZE:100}
    executor:
      core-pool-size: ${SUBSCRIPTION_BILLING_CORE_POOL_SIZE:10}
      max-pool-size: ${SUBSCRIPTION_BILLING_MAX_POOL_SIZE:20}
      queue-capacity: ${SUBSCRIPTION_BILLING_QUEUE_CAPACITY:500}
      await-termination-seconds: ${SUBSCRIPTION_BILLING_AWAIT_TERMINATION_SECONDS:30}
